<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripMate - 회원가입</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>TripMate</h1>
      <p class="subtitle">회원가입하고 나만의 여행 일정을 저장해 보세요</p>
    </header>

    <main>
      <form id="signup-form" class="card" method="post" novalidate>
        <div class="field-group">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" maxlength="20" placeholder="다른 사람에게 보일 이름">
        </div>
        <div class="field-group">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="example@email.com">
        </div>
        <div class="field-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="6자 이상">
        </div>
        <div class="field-group">
          <label for="password-check">비밀번호 확인</label>
          <input type="password" id="password-check" placeholder="한 번 더 입력">
        </div>
        <p class="error-text" id="message" role="alert"></p>
        <button type="submit" class="submit-btn" id="signup-btn">회원가입</button>
        <p class="helper-text">이미 계정이 있나요? <a href="index.html">로그인</a></p>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const message = document.getElementById('message');
    const button = document.getElementById('signup-btn');

    // 안내 문구 표시 (ok=true면 초록색, 아니면 빨간색)
    function show(text, ok) {
      message.textContent = text;
      message.style.color = ok ? 'var(--accent)' : '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nickname = document.getElementById('nickname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordCheck = document.getElementById('password-check').value;

      if (!nickname || !email || !password) return show('모든 칸을 입력해 주세요.');
      if (password.length < 6) return show('비밀번호는 6자 이상이어야 해요.');
      if (password !== passwordCheck) return show('비밀번호 확인이 일치하지 않아요.');

      button.disabled = true;
      show('가입 요청 중...', true);

      // 닉네임은 인증 정보에 실어 보내고, DB 트리거가 users 테이블에 저장
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { nickname },
          // 인증 메일의 링크를 누르면 돌아올 주소 (배포 주소의 로그인 화면)
          emailRedirectTo: location.origin + '/index.html'
        }
      });

      button.disabled = false;
      if (error) return show('가입 실패: ' + error.message);
      if (data.user && data.user.identities && data.user.identities.length === 0) {
        return show('이미 가입된 이메일이에요. 로그인해 주세요.');
      }
      form.reset();
      show('인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.', true);
    });
  </script>
</body>
</html>
