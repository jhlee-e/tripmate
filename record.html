<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripMate - 내 여행</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <nav class="top-nav">
      <span id="nav-user"></span>
      <a href="condition.html">새 여행 만들기</a>
      <a href="courses.html">공개 코스</a>
      <button type="button" class="link-btn" onclick="logout()">로그아웃</button>
    </nav>
    <header>
      <h1>내 여행</h1>
      <p class="subtitle">여행을 누르면 일정·비용·준비물을 한곳에서 볼 수 있어요</p>
    </header>

    <main>
      <!-- 나의 기록 지도: record.js가 내 여행들의 장소(trip_places)와 사진(photos)을 지도에 표시 -->
      <section class="card" id="map-card" hidden>
        <h2 class="section-title">나의 기록 지도 <small>점 = 일정 장소, 동그라미 = 사진</small></h2>
        <div id="record-map" class="record-map"></div>
        <ul class="map-legend" id="map-legend"></ul>
      </section>
      <!-- 내 여행 목록: record.js가 trips 테이블에서 불러와 채움 -->
      <section class="card">
        <h2 class="section-title">저장한 여행</h2>
        <ul class="trip-list" id="trip-list"></ul>
        <p class="helper-text muted" id="trip-empty">아직 저장한 여행이 없어요. <a href="condition.html">새 여행 만들기</a></p>
      </section>
      <p class="error-text" id="error-text" role="alert"></p>
    </main>
  </div>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b16ac532d356919ddc87b6d14d8dbd01&autoload=false"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/record.js"></script>
</body>
</html>
