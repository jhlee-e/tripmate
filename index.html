<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripMate - 로그인</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>TripMate</h1>
      <p class="subtitle">취향에 맞는 국내 여행 일정을 추천해 드려요</p>
    </header>

    <main>
      <!-- 로그인 화면 자리: 실제 로그인 동작은 6차시(Supabase 연결)에 구현 -->
      <form class="card" onsubmit="return false;">
        <div class="field-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="example@email.com">
        </div>
        <div class="field-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호">
        </div>
        <!-- 임시: 비밀번호가 주소창에 남지 않도록 폼 제출 대신 링크로 이동 -->
        <a href="condition.html" class="submit-btn">로그인</a>
        <p class="helper-text">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
        <p class="helper-text muted">※ 임시: 지금은 로그인 버튼을 누르면 조건 입력 화면으로 바로 이동합니다.</p>
      </form>
    </main>
  </div>
</body>
</html>
