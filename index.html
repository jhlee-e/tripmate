<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripMate - 로그인</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>TripMate</h1>
      <p class="subtitle">취향에 맞는 국내 여행 일정을 추천해 드려요</p>
    </header>

    <main>
      <form id="login-form" class="card" method="post" novalidate>
        <div class="field-group">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="example@email.com">
        </div>
        <div class="field-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호">
        </div>
        <p class="error-text" id="message" role="alert"></p>
        <button type="submit" class="submit-btn" id="login-btn">로그인</button>
        <p class="helper-text">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    const button = document.getElementById('login-btn');

    // 안내 문구 표시 (ok=true면 초록색, 아니면 빨간색)
    function show(text, ok) {
      message.textContent = text;
      message.style.color = ok ? 'var(--accent)' : '';
    }

    // 이미 로그인된 상태(세션이 브라우저에 남아 있음)면 바로 조건 입력으로
    sb.auth.getSession().then(({ data }) => {
      if (data.session) location.href = 'condition.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return show('이메일과 비밀번호를 입력해 주세요.');

      button.disabled = true;
      show('로그인 중...', true);

      const { error } = await sb.auth.signInWithPassword({ email, password });

      button.disabled = false;
      if (error) {
        // Supabase 영어 오류 메시지를 자주 나오는 것만 한국어로 바꿔 표시
        if (error.message.includes('Email not confirmed')) return show('메일 인증이 아직 안 됐어요. 회원가입 화면에서 인증 코드를 입력해 주세요.');
        if (error.message.includes('Invalid login credentials')) return show('이메일 또는 비밀번호가 맞지 않아요.');
        return show('로그인 실패: ' + error.message);
      }
      location.href = 'condition.html';
    });
  </script>
</body>
</html>
